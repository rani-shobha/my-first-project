<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flex Example</title>
        <style>
            .parent{
                display:flex;
                height: 100vh;
                align-items:center;
            }
            .item1{
                flex:1;
                height: 100vh;
                background-image: url("./meeshow.png");
                background-repeat: no-repeat;
                background-position: center center;
            }
            .item2{
                flex:1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .info1{
                font-size: 20px;
            }
            .info2, info3, .info4{
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="item1"></div>
            <div class="item2">
                <p class="info1">Finishing School </p>
                <p class="info1">Cyber towers</p>
                <p class="info1">Hi Tech city</p>
                <p class="info1" > Hyderabad</p>
                <p class="info1"> 500081</p>
            </div>
        </div>
    </body>
</html>
