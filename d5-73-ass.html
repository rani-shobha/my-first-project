<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Example</title>
    <style>
        .box {
            border: 5px double black; 
            width: 50%;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .links {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding-bottom: 300px;
        }
        a {
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            color: black;
        }
        .footer-text {
            font-size: 16px;
            font-weight: bold;
            color: black;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="links">
            <a href="https://www.flipkart.com" target="_blank">Flipkart</a>
            <a href="https://www.amazon.in/" target="_blank">Amazon</a>
            <a href="https://www.ajio.com/" target="_blank">AJIO</a>
            <a href="https://www.myntra.com/" target="_blank">Myntra</a>
        </div>
        <div class="footer-text">
            Text is not SVG - cannot display
        </div>
    </div>

</body>
</html>
