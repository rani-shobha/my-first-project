<!DOCTYPE html>
<html>
    <head>
        <title>Tables</title>
        <style>
            h1 {
                text-align: center;
                margin-bottom: 20px;
                font-size: 24px;
            }
            table {
                width: 25%;
                margin: auto;
            }
            th, td {
                border: 1px double solid grey;
                text-align: left;
                font-size: 18px;
            }
            th {
                background-color: white;
            }
            .head{
                display: flex;
                justify-content: center;
            }
        </style>
    </head>
    <body> 
            <div class="head">
            <img src=" https://tse4.mm.bing.net/th?id=OIP.CYAMXqfgsWg3Ix91RJbbYAHaHa&pid=Api&P=0&h=180" alt="error" width="50px" height="70px" > 
            <h1>Create Tables in HTML</h1>
            </div>
            <table border="1px">
        <!--ROW1-->
        <tr>
            <th>column1</th>
            <th>column2</th>
            <th>column3</th>
        </tr>
        <!--ROW2-->
        <tr>
            <th rowspan="2">row1cell1</th>
            <th >row2cell2</th>
            <th>row3cell3</th>
        </tr>
          <!--ROW3-->
          <tr>
            <th>row1cell2</th>
            <th>row1cell3</th>
        </tr>
           <!--ROW4-->
           <tr>
            <th colspan="3">row3cell1</th>
        </tr>
    </table>    
    </body>
</html>
