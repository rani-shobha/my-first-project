<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static vs Relative Positioning</title>
    <style>
        .static-box {
            width: 200px;
            height: 100px;
            background-color: gray;
        }
        .relative-box {
            width: 200px;
            height: 100px;
            background-color: darkgray;
            position: relative;
            left: 20px;
            top: 10px;
        }
    </style>
</head>
<body>
    <div class="static-box">Static Div</div>
    <div class="relative-box">Relative Div (Moved Right & Down)</div>
</body>
</html>
