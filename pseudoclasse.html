<!DOCTYPE html>
<html>
    <head>
        <title>Pseudoclass</title>
        <style>
            p:first-child{
                background-color: blue;
                color: aliceblue;
            }
            p:last-child{
                background-color: aqua;
                color: bisque;
            }
            p:nth-child(2){
                background-color: brown;
                color:cornflowerblue;
            }
            p:not(2){
                background-color: darkorange;
                -ms-scrollbar-track-color: rgb(116, 155, 148);
            }
            p:hover{
                background-color: rgb(113, 19, 80);
            }
        </style>
    </head>
    <body>
        <p>FNS1</p>
        <p>FNS2</p>
        <p>FNS3</p>
        <p>FNS4</p>
        <p>FNS5</p>
        <p>FNS6</p>
        <p>FNS7</p>
        <p>FNS8 </p>
        <p>FNS9</p>
        <p>FNS10</p>
    </body>
</html>
