<!DOCTYPE html>
<html>
    <head>
        <title>marquee tag</title>
    </head>
    <body>
        <h2><marquee>Finishing School</marquee></h2>
        <h2><marquee direction="right">SHOBHA RANI DOREPALLI</marquee></h2>
        <h2><marquee direction="left">Fullstack</marquee></h2>
        <h2><marquee direction="up">Hosanna Ministries</marquee></h2>
        <h2><marquee direction="down">Finishing School</marquee></h2>
        <h2><marquee width="50%">Finishing School</marquee></h2>
        <h2><marquee scrollamount="50">Finishing School</marquee></h2>
    </body>
</html>
