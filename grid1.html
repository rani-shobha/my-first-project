<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grid Example</title>
        <style>
            .parent{
                display: grid;
                width: 100vw;
                height: 100vh;
                place-items: center;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <img src="meeshow.png">
        </div>
    </body>
</html>
