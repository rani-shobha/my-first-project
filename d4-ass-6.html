<!DOCTYPE html>
<html>
    <head>
        <title>Buttons</title>
    </head>
    <body>
        <button type="button" style="background-color: blue; color: white; font-size: 16px; padding: 10px 20px; border: none; cursor: pointer;" onclick="showAlert()">
            Click Me
        </button>
        <button>
            <button type="submit" value="Submit" style="background-color: green; color: white; font-size: 16px; padding: 10px 20px; border: none; cursor: pointer;">
        </button>
        <button><input type="text" placeholder="Enter something">
            <button type="reset" value="Reset" style="background-color: red; color: white; font-size: 16px; padding: 10px 20px; border: none; cursor: pointer;"></button>
        <script>
            function showAlert() {
                alert("Button clicked!");
            }
        </script>
    </body>
</html>
