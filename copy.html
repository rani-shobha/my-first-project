<!DOCTYPE html>
<html>
<head>
    <title>Website Example</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .box {
            border: 5px double black; 
            padding: 20px;
            padding-bottom: 300px;
            display: flex;
            justify-content: space-around; 
            width: 50%;
            margin: auto; 
            text-align: center;
        }
        .footer-text {
            font-size: 16px;
            font-weight: bold;
            color: black;
        }
    </style>
</head>
<body>

    <div class="box">
        <a href="https://www.flipkart.com" target="_blank">Flipkart</a>
        <a href="https://www.amazon.in/" target="_blank">Amazon</a>
        <a href="https://www.ajio.com/" target="_blank">AJIO</a>
        <a href="https://www.myntra.com/" target="_blank">Myntra</a>
    </div>
    <div class="footer text">
        Text is not SVG - cannot display
    </div>
</body>
</html>
