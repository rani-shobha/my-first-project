<!DOCTYPE html>
<html>
    <head>
        <title>Divisions</title>
        <link rel="stylesheet" href="d4-ass3.css">
    </head>
        <body>
            <Div class="Box">
                <P>Class Selector (.)
                    Used to style multiple elements with the same class.
                    Defined in CSS using a dot (.) (e.g., .example { color: blue; }).
                    Example in HTML: <div class="box"></div>
                </P>
            </Div>

            <Div id="Highlight">
                <p>ID Selector (#)
                     Used to style a single, unique element.
                    Defined in CSS using a hash (#) (e.g., #unique { color: red; }).
                    Example in HTML: <div id="header"></div></p>
            </Div>            
        </body>
</html>
