<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Positioning</title>
    <style>
        .parent {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: yellow;
        }
        .absolute-box {
            position: absolute;
            top: 30px;
            left: 50px;
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="absolute-box">Absolute Box</div>
    </div>
</body>
</html>
