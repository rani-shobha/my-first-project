<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Only Modal</title>
    <style>
        .modal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }
        /* Checkbox to trigger modal */
        #modal-toggle {
            display: none;
        }
        #modal-toggle:checked + .modal-bg {
            display: flex;
        }
    </style>
</head>
<body>
    <label for="modal-toggle">Open Modal</label>
    <input type="checkbox" id="modal-toggle">
    
    <div class="modal-bg">
        <div class="modal">
            <p>This is a modal.</p>
            <label for="modal-toggle">Close</label>
        </div>
    </div>
</body>
</html>
