<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box Sizing</title>
        <style>
            .c1{
                width: 200px;
                height: 200px;
                border: 10px solid gray;
                padding: 10px;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <div class="c1"></div>
    </body>
</html>
